spring:
  application:
    name: multi-tenant-task-manager
  datasource:
    # One shared H2 database (file-based so data survives restarts). AUTO_SERVER lets the
    # H2 console or an external client connect while the app is running.
    url: jdbc:h2:file:./data/taskdb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    deserialization:
      # Any unexpected field (e.g. "tenant_id") in a request body is rejected with 400.
      fail-on-unknown-properties: true

jwt:
  # Override in any real environment: JWT_SECRET must be at least 32 bytes (HS256).
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${PORT:8080}
